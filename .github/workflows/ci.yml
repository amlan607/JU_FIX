# Continuous integration for the JU_FIX Medical Centre Automation System.
#
# Every push and pull request runs the same checks a developer runs locally:
# lint, unit tests and a production build. A pull request that fails here is
# not merged (Team Practice: Git workflow).

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (FastAPI + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit and API tests
        run: python -m pytest -v --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (React + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run component and unit tests
        run: npm run test

      - name: Production build
        run: npm run build
